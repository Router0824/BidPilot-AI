apiVersion: apps/v1
kind: Deployment
metadata:
  name: bidpilot-frontend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: bidpilot-frontend
  template:
    metadata:
      labels:
        app: bidpilot-frontend
    spec:
      containers:
        - name: frontend
          image: {{ .Values.image.frontend }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: bidpilot-frontend
spec:
  type: {{ .Values.service.type }}
  selector:
    app: bidpilot-frontend
  ports:
    - port: {{ .Values.service.frontendPort }}
      targetPort: 80
