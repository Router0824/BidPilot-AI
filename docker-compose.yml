services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - BIDPILOT_DATABASE_URL=sqlite+aiosqlite:///./data/bidpilot.db
      - BIDPILOT_UPLOAD_DIR=/app/uploads
      - BIDPILOT_RUNTIME_CONFIG_PATH=/app/data/bidpilot_runtime_config.json
      - BIDPILOT_DEBUG=false
    volumes:
      - bidpilot_data:/app/uploads
      - bidpilot_db:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  bidpilot_data:
  bidpilot_db:
